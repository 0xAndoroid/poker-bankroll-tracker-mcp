name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Smoke-test the CLI
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PBT_API_KEY: ci-fixture
        run: |
          node --import ./.github/fixtures/session.mjs dist/cli.js \
            stats --start 2026-03-15 --type cashgame --currency USD --json |
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const { totalSessions, totalProfit } = JSON.parse(readFileSync(0, "utf8"));
              assert.equal(totalSessions, 1);
              assert.equal(totalProfit, 700);
            '
      - run: npm test
        if: github.event_name != 'pull_request'

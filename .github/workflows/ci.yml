name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    name: Check for changes since the last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip_suite: ${{ steps.compare.outputs.skip_suite }}
    steps:
      - id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $GITHUB_SHA =~ ^[0-9a-f]{40}$ || ! $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ || ! $GITHUB_RUN_NUMBER =~ ^[1-9][0-9]*$ ]]; then
            exit 0
          fi
          previous_sha=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=schedule&status=completed&per_page=100" |
              jq -r --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" '
                [.workflow_runs[] | select(.event == "schedule" and .head_branch == "main" and .status == "completed"
                  and .id != $id and .run_number > 0 and .run_number < $number
                  and (.conclusion == "success" or .conclusion == "failure"))]
                | max_by(.run_number).head_sha // empty'
          ) || previous_sha=
          if [[ "$previous_sha" == "$GITHUB_SHA" ]]; then
            printf 'skip_suite=true\n' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint, format, build, test
    needs: nightly
    if: >-
      ${{ !cancelled() && (github.event_name != 'schedule' ||
      needs.nightly.result != 'success' || needs.nightly.outputs.skip_suite != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Smoke-test the CLI
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PBT_API_KEY: ci-fixture
        run: |
          node --import ./.github/fixtures/session.mjs dist/cli.js \
            stats --start 2026-03-15 --type cashgame --currency USD --json |
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const { totalSessions, totalProfit } = JSON.parse(readFileSync(0, "utf8"));
              assert.equal(totalSessions, 1);
              assert.equal(totalProfit, 700);
            '
      - run: npm test
        if: github.event_name != 'pull_request'
